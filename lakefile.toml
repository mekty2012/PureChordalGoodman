name = "PureChordal"
defaultTargets = ["PureChordal"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "PureChordal"
# The `unusedSectionVars` linter fires on essentially every lemma here: these
# files share broad `variable` blocks, so most lemmas legitimately do not use
# every ambient instance.  Disable just that linter package-wide (all genuinely
# useful linters stay on).
leanOptions = [{name = "linter.unusedSectionVars", value = false}]
